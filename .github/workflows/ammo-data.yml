# Keeps the baked ammo table in step with the wiki.
#
# ONE-TIME SETUP, or the PR step fails on its first real update: in
# Settings -> Actions -> General, tick "Allow GitHub Actions to create and
# approve pull requests". GitHub blocks that for workflows by default, over
# and above the permissions block below.
#
# Ammo stats only move when the game patches, and the wiki is edited in bursts
# around those patches, so this checks weekly and does nothing at all unless
# the numbers actually changed. When they have, it opens a pull request rather
# than committing: the generated file carries each round's name in a comment,
# so the diff reads like "M995 damage 42 -> 45" and is worth a human glance
# before it ships. It also means a vandalised or restructured wiki page cannot
# land in a release on its own.

name: Refresh ammo table

on:
  schedule:
    # Mondays, early UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ammo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate the table
        run: node scripts/generate-ammo-effectiveness.mjs

      - name: Open a pull request if the numbers moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=models/ammoEffectiveness.generated.ts

          if git diff --quiet -- "$FILE"; then
            echo "The wiki has not changed since the table was last built."
            exit 0
          fi

          # A typo fix anywhere on the page bumps the revision stamp without
          # moving a single number. Only data lines are worth a pull request.
          if git diff -U0 -- "$FILE" | grep -E '^[+-][^+-]' | grep -vq '^[+-]// Wiki revision'; then
            echo "Data lines changed."
          else
            echo "Only the revision stamp moved (a wiki edit that touched no ammo data) - skipping."
            git checkout -- "$FILE"
            exit 0
          fi

          echo "Changes found:"
          git diff --stat -- "$FILE"

          REVISION=$(sed -n 's|^// Wiki revision \([0-9]*\),.*|\1|p' "$FILE")
          EDITED=$(sed -n 's|^// Wiki revision [0-9]*, last edited \(.*\)$|\1|p' "$FILE")
          CHANGED=$(git diff -U0 -- "$FILE" | grep -c '^+  "' || true)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ammo-data
          git add "$FILE"
          git commit -m "Refresh ammo table (wiki revision ${REVISION})"
          git push --force -u origin ammo-data

          if [ -n "$(gh pr list --head ammo-data --state open --json number -q '.[].number')" ]; then
            echo "The existing pull request has been updated."
            exit 0
          fi

          gh pr create \
            --base main \
            --head ammo-data \
            --title "Refresh ammo table (wiki revision ${REVISION})" \
            --body "$(cat <<BODY
          The [wiki's Ballistics page](https://escapefromtarkov.fandom.com/wiki/Ballistics) changed, so the baked armour and damage grades are out of step with it.

          - Wiki revision \`${REVISION}\`, last edited **${EDITED}**
          - ${CHANGED} round(s) touched

          Regenerated by \`npm run generate:ammo\`. Worth skimming the diff — each line names its round — then merging and cutting a release when convenient.
          BODY
          )" || {
            echo "::error::gh pr create failed. If the message says GitHub Actions is not permitted to create pull requests, tick 'Allow GitHub Actions to create and approve pull requests' under Settings -> Actions -> General. The refreshed table is already pushed to the ammo-data branch."
            exit 1
          }
